model:
  provider: ollama-cloud
  default: kimi-k2.7-code
cron:
  provider: disabled
kanban:
  dispatch_in_gateway: false
platform_toolsets:
  # Paperclip supplies the task, workspace, authority, and completion helpers.
  # Expose only the execution helpers and Hermes' progressively disclosed skill
  # loader. The loader makes the image's pinned GitHub and engineering workflows
  # available on demand without repeating the full default tool catalog on every
  # provider turn.
  api_server:
    - terminal
    - skills
agent:
  # Outer host safety ceiling only. Paperclip remains the per-task authority:
  # the default provider envelope is 8 turns and explicit envelopes may widen
  # only up to this formally declared ceiling.
  max_turns: 32
  verify_on_stop: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: /opt/data/bin/tirith
  tirith_fail_open: false
_config_version: 36
