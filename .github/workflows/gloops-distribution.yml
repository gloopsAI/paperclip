name: GLoops Distribution

on:
  pull_request:
    branches:
      - "gloops/stable"
  push:
    branches:
      - "gloops/stable"
    tags:
      - "gloops/v*"
    # Fast-only stable pushes publish through gloops-distribution-fast.yml.
    # Tag pushes ignore path filters and still run this full release workflow.
    paths-ignore:
      - "packages/adapters/hermes/src/**"
      - "server/src/services/execution-admission.ts"
      - "server/src/services/execution-admission.test.ts"
      - "server/src/services/guarded-admission-reset.ts"
      - "server/src/services/heartbeat.ts"
      - "server/src/__tests__/guarded-admission-reset.test.ts"
      - "server/src/__tests__/heartbeat-comment-wake-batching.test.ts"
      - "gloops-distribution/deploy/hermes/pin-paperclip-image.sh"
      - "gloops-distribution/deploy/hermes/pin_paperclip_image_test.sh"

# One canonical publication per ref. Successive merges to gloops/stable share
# refs/heads/gloops/stable, so older in-flight multiarch release runs are
# cancelled before they can finish and overwrite stable. PR refs
# (refs/pull/N/merge) and tag refs stay isolated so PR CI and tag builds do
# not cancel each other or cross-contaminate. Manual release.yml
# workflow_dispatch is intentionally untouched.
concurrency:
  group: gloops-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  paperclip-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/release-verify.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  verify-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Verify owned distribution manifest
        run: node scripts/verify-gloops-distribution.mjs

      - name: Rehearse internal control-plane firewall readiness
        run: sudo gloops-distribution/deploy/hermes/rehearse-handshake-control-plane-firewall.sh

  container:
    needs:
      - paperclip-ci
      - verify-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/gloopsai/paperclip-gloops
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/gloops/stable' }}
            type=sha,prefix=sha-
            type=match,pattern=gloops/v(.*),group=1

      - name: Build and conditionally publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: gloops-production
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=gloops-distribution
          cache-to: type=gha,mode=max,scope=gloops-distribution
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest published image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/gloopsai/paperclip-gloops
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
