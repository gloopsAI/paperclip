name: GLoops Distribution Fast

on:
  pull_request:
    branches:
      - "gloops/stable"
    paths:
      - "packages/adapters/hermes/src/**"
      - "server/src/services/execution-admission.ts"
      - "server/src/services/execution-admission.test.ts"
      - "server/src/services/guarded-admission-reset.ts"
      - "server/src/services/heartbeat.ts"
      - "server/src/__tests__/guarded-admission-reset.test.ts"
      - "server/src/__tests__/heartbeat-comment-wake-batching.test.ts"
      - "gloops-distribution/deploy/hermes/pin-paperclip-image.sh"
      - "gloops-distribution/deploy/hermes/pin_paperclip_image_test.sh"
  push:
    branches:
      - "gloops/stable"
    paths:
      - "packages/adapters/hermes/src/**"
      - "server/src/services/execution-admission.ts"
      - "server/src/services/execution-admission.test.ts"
      - "server/src/services/guarded-admission-reset.ts"
      - "server/src/services/heartbeat.ts"
      - "server/src/__tests__/guarded-admission-reset.test.ts"
      - "server/src/__tests__/heartbeat-comment-wake-batching.test.ts"
      - "gloops-distribution/deploy/hermes/pin-paperclip-image.sh"
      - "gloops-distribution/deploy/hermes/pin_paperclip_image_test.sh"
  workflow_dispatch:

concurrency:
  group: gloops-distribution-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
      heartbeat_touched: ${{ steps.classify.outputs.heartbeat_touched }}
    steps:
      - name: Checkout exact revision with history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            git diff-tree --no-commit-id --no-renames --name-only -r "${HEAD_SHA}" > /tmp/gloops-fast-files
          else
            git diff --no-renames --name-only "${BASE_SHA}" "${HEAD_SHA}" > /tmp/gloops-fast-files
          fi
          node scripts/classify-gloops-fast-path.mjs \
            --github-output "${GITHUB_OUTPUT}" /tmp/gloops-fast-files

  focused-verify:
    needs: classify
    if: needs.classify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck touched packages
        run: |
          pnpm --filter @paperclipai/hermes-paperclip-adapter typecheck
          pnpm --filter @paperclipai/server typecheck

      - name: Run Hermes and admission focused tests
        run: |
          pnpm --filter @paperclipai/hermes-paperclip-adapter exec vitest run \
            src/gateway/server/execute.test.ts
          pnpm exec vitest run \
            server/src/services/execution-admission.test.ts \
            server/src/__tests__/guarded-admission-reset.test.ts

      - name: Run heartbeat comment-wake batching when heartbeat changed
        if: needs.classify.outputs.heartbeat_touched == 'true'
        run: pnpm exec vitest run server/src/__tests__/heartbeat-comment-wake-batching.test.ts

      - name: Verify deploy tools and fast-path classifier
        run: |
          node --test scripts/classify-gloops-fast-path.test.mjs
          bash gloops-distribution/deploy/hermes/pin_paperclip_image_test.sh
          node scripts/verify-gloops-distribution.mjs

  fast-container-build:
    needs:
      - classify
      - focused-verify
    if: needs.classify.outputs.eligible == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/gloopsai/paperclip-gloops
          tags: type=sha,prefix=sha-

      - name: Build without publication authority
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: gloops-production
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=gloops-distribution
          cache-to: type=gha,mode=max,scope=gloops-distribution
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  fast-container:
    needs:
      - classify
      - focused-verify
    if: needs.classify.outputs.eligible == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/gloopsai/paperclip-gloops
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/gloops/stable' }}
            type=sha,prefix=sha-

      - name: Build and conditionally publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: gloops-production
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=gloops-distribution
          cache-to: type=gha,mode=max,scope=gloops-distribution
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest published image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ghcr.io/gloopsai/paperclip-gloops
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
