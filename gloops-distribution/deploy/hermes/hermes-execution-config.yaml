model:
  provider: ollama-cloud
  default: kimi-k2.7-code
cron:
  provider: disabled
kanban:
  dispatch_in_gateway: false
agent:
  # Paperclip remains the per-task authority. Keep the host ceiling above the
  # largest admitted work order so Hermes does not silently truncate it first.
  max_turns: 32
  verify_on_stop: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: /opt/data/bin/tirith
  tirith_fail_open: false
_config_version: 35
