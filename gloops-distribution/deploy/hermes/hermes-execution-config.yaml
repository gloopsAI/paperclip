model:
  provider: ollama-cloud
  default: kimi-k2.7-code
cron:
  provider: disabled
kanban:
  dispatch_in_gateway: false
platform_toolsets:
  # Paperclip supplies the task, workspace, authority, and completion helpers.
  # Keep the execution-only API surface to the one toolset required to invoke
  # those helpers; the default Hermes catalog repeats large unrelated schemas
  # on every provider turn and can exhaust a bounded task before useful work.
  api_server:
    - terminal
agent:
  # Outer host safety ceiling only. Paperclip remains the per-task authority:
  # the default provider envelope is 8 turns and explicit envelopes may widen
  # only up to this formally declared ceiling.
  max_turns: 32
  verify_on_stop: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: /opt/data/bin/tirith
  tirith_fail_open: false
_config_version: 35
