model:
  provider: ollama-cloud
  default: kimi-k2.7-code
moa:
  default_preset: ollama-build
  privacy_filter: full
  presets:
    ollama-build:
      # Advisor runs once per user turn; GLM remains the acting Hermes agent
      # and owns implementation, tool use, and verification.
      reference_models:
        - provider: ollama-cloud
          model: kimi-k2.7-code
          reasoning_effort: low
      aggregator:
        provider: ollama-cloud
        model: glm-5.2
        reasoning_effort: medium
      reference_max_tokens: 600
      fanout: user_turn
      max_tokens: 16384
      enabled: true
cron:
  provider: disabled
kanban:
  dispatch_in_gateway: false
platform_toolsets:
  # Paperclip supplies the task, workspace, authority, and completion helpers.
  # Expose only the execution helpers and Hermes' progressively disclosed skill
  # loader. The loader makes the image's pinned GitHub and engineering workflows
  # available on demand without repeating the full default tool catalog on every
  # provider turn.
  api_server:
    - terminal
    - file
    - skills
platforms:
  api_server:
    enabled: true
    extra:
      # Hermes' API server treats the incoming model value as a client alias.
      # Only aliases present here select a non-default model; an unknown alias
      # continues to resolve to the global Kimi default and is rejected by
      # Paperclip's requested-versus-resolved route receipt.
      model_routes:
        kimi-k2.7-code:cloud:
          model: kimi-k2.7-code
          provider: ollama-cloud
        minimax-m3:cloud:
          model: minimax-m3
          provider: ollama-cloud
        glm-5.2:cloud:
          model: glm-5.2
          provider: ollama-cloud
        deepseek-v4-flash:cloud:
          model: deepseek-v4-flash
          provider: ollama-cloud
        qwen3.5:cloud:
          model: qwen3.5
          provider: ollama-cloud
        ollama-build:
          model: ollama-build
          provider: moa
agent:
  # Match the upstream Hermes completion envelope. Paperclip remains the
  # per-task authority and may issue a smaller task-specific turn budget.
  max_turns: 90
  verify_on_stop: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: /opt/data/bin/tirith
  tirith_fail_open: false
_config_version: 37
